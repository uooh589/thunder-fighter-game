<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>雷霆战机 - Thunder Fighter</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a1a;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Segoe UI', 'Arial', sans-serif;
    user-select: none;
  }
  .game-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  canvas {
    border: 2px solid #3399ff;
    border-radius: 8px;
    box-shadow: 0 0 40px rgba(51,153,255,0.3);
    display: block;
    cursor: none;
  }
  .info-bar {
    width: 100%;
    display: flex;
    justify-content: space-between;
    color: #88ccff;
    font-size: 14px;
    padding: 0 4px;
  }
  .controls {
    color: #6699aa;
    font-size: 13px;
    letter-spacing: 0.5px;
  }
  .controls kbd {
    background: #1a2a3a;
    color: #66ddff;
    padding: 2px 8px;
    border-radius: 4px;
    border: 1px solid #335566;
    font-size: 12px;
  }
  .restart-btn {
    background: #1a2a3a;
    color: #66ddff;
    border: 1px solid #3399ff;
    padding: 6px 20px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    transition: all 0.2s;
  }
  .restart-btn:hover {
    background: #1a3a5a;
    box-shadow: 0 0 15px rgba(51,153,255,0.4);
  }
</style>
</head>
<body>
<div class="game-wrapper">
  <div class="info-bar">
    <span id="scoreDisplay">得分: 0</span>
    <span id="livesDisplay">❤❤❤</span>
  </div>
  <canvas id="gameCanvas" width="800" height="600"></canvas>
  <div class="controls">
    <kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd> 或 <kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> 移动 &nbsp;|&nbsp; <kbd>R</kbd> 重新开始 &nbsp;|&nbsp; <button class="restart-btn" id="restartBtn">✈ 重新开始</button>
  </div>
</div>
<script>
(function() {
  'use strict';

  // ============ DOM refs ============
  var canvas = document.getElementById('gameCanvas');
  var ctx = canvas.getContext('2d');
  var scoreSpan = document.getElementById('scoreDisplay');
  var livesSpan = document.getElementById('livesDisplay');

  var W = 800, H = 600;

  // ============ State ============
  var state = {
    player: null,
    bullets: [],
    enemies: [],
    explosions: [],
    particles: [],
    stars: [],
    score: 0,
    lives: 3,
    maxLives: 3,
    invincible: 0,
    gameOver: false,
    frame: 0,
    shootCooldown: 0,
    running: true,
    paused: false
  };

  // ============ Keys ============
  var keys = {};
  window.addEventListener('keydown', function(e) {
    keys[e.key] = true;
    if (e.key === 'r' || e.key === 'R') {
      restartGame();
    }
    if (e.key === 'ArrowUp' || e.key === 'ArrowDown' ||
        e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === ' ') {
      e.preventDefault();
    }
  });
  window.addEventListener('keyup', function(e) {
    keys[e.key] = false;
  });
  document.getElementById('restartBtn').addEventListener('click', restartGame);

  // ============ Player ============
  function makePlayer() {
    return { x: W/2, y: H-60, w: 28, h: 34 };
  }

  // ============ Entities ============
  function spawnEnemy() {
    if (state.enemies.length >= 20) return;
    var size = 16 + Math.random() * 16;
    var type = Math.random() > 0.5 ? 'triangle' : 'diamond';
    state.enemies.push({
      x: Math.random() * (W - size) + size/2,
      y: -size,
      w: size,
      h: size,
      speed: 1.0 + Math.random() * 2.0,
      type: type
    });
  }

  function spawnBullet() {
    if (state.bullets.length >= 30) return;
    var p = state.player;
    state.bullets.push({
      x: p.x,
      y: p.y - p.h/2 - 6,
      w: 4,
      h: 14,
      speed: 9
    });
  }

  function spawnExplosion(x, y, size) {
    var count = 6 + Math.floor(size / 5);
    for (var i = 0; i < count; i++) {
      var angle = Math.random() * Math.PI * 2;
      var spd = 1 + Math.random() * 3;
      state.particles.push({
        x: x, y: y,
        vx: Math.cos(angle) * spd,
        vy: Math.sin(angle) * spd,
        life: 15 + Math.random() * 20,
        maxLife: 35,
        size: 2 + Math.random() * 3,
        r: 255,
        g: 100 + Math.floor(Math.random() * 155),
        b: 0
      });
    }
  }

  // ============ Lifecycle ============
  function restartGame() {
    for (var k in keys) keys[k] = false;
    state.player = makePlayer();
    state.bullets = [];
    state.enemies = [];
    state.explosions = [];
    state.particles = [];
    state.score = 0;
    state.lives = state.maxLives;
    state.invincible = 0;
    state.gameOver = false;
    state.frame = 0;
    state.shootCooldown = 0;
    state.running = true;
    state.paused = false;
    initStars();
    updateUI();
  }

  // ============ Stars ============
  function initStars() {
    state.stars = [];
    for (var i = 0; i < 100; i++) {
      state.stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        speed: 0.3 + Math.random() * 0.8,
        size: 0.5 + Math.random() * 1.5,
        bright: 0.3 + Math.random() * 0.7
      });
    }
  }

  // ============ Update ============
  function update() {
    if (state.gameOver) return;

    state.frame++;

    // --- Player movement ---
    var p = state.player;
    if (keys['ArrowLeft'] || keys['a'] || keys['A']) p.x -= 5;
    if (keys['ArrowRight'] || keys['d'] || keys['D']) p.x += 5;
    if (keys['ArrowUp'] || keys['w'] || keys['W']) p.y -= 5;
    if (keys['ArrowDown'] || keys['s'] || keys['S']) p.y += 5;
    if (p.x < p.w/2) p.x = p.w/2;
    if (p.x > W - p.w/2) p.x = W - p.w/2;
    if (p.y < p.h/2) p.y = p.h/2;
    if (p.y > H - p.h/2) p.y = H - p.h/2;

    // --- Invincibility ---
    if (state.invincible > 0) state.invincible--;

    // --- Auto shoot ---
    if (state.shootCooldown <= 0) {
      spawnBullet();
      state.shootCooldown = 8;
    } else {
      state.shootCooldown--;
    }

    // --- Spawn enemies ---
    if (state.frame % 30 === 0) {
      spawnEnemy();
    }

    // --- Move bullets ---
    for (var i = state.bullets.length - 1; i >= 0; i--) {
      var b = state.bullets[i];
      b.y -= b.speed;
      if (b.y + b.h < 0) {
        state.bullets.splice(i, 1);
      }
    }

    // --- Move enemies ---
    for (var i = state.enemies.length - 1; i >= 0; i--) {
      var e = state.enemies[i];
      e.y += e.speed;
      if (e.y - e.h > H) {
        state.enemies.splice(i, 1);
      }
    }

    // --- Bullet vs Enemy ---
    for (var i = state.bullets.length - 1; i >= 0; i--) {
      var b = state.bullets[i];
      var hit = false;
      for (var j = state.enemies.length - 1; j >= 0; j--) {
        var e = state.enemies[j];
        if (b.x < e.x + e.w/2 && b.x > e.x - e.w/2 &&
            b.y < e.y + e.h/2 && b.y > e.y - e.h/2) {
          spawnExplosion(e.x, e.y, e.w);
          state.score += 10;
          updateUI();
          state.enemies.splice(j, 1);
          hit = true;
          break;
        }
      }
      if (hit) {
        state.bullets.splice(i, 1);
      }
    }

    // --- Player vs Enemy (max 1 hit per frame) ---
    if (state.invincible <= 0) {
      for (var i = state.enemies.length - 1; i >= 0; i--) {
        var e = state.enemies[i];
        // Use distance-based collision (center to center)
        var dx = p.x - e.x;
        var dy = p.y - e.y;
        var dist = Math.sqrt(dx * dx + dy * dy);
        var collideDist = p.w/2 + e.w/2 - 4; // slight tolerance
        if (dist < collideDist) {
          spawnExplosion(e.x, e.y, e.w);
          state.enemies.splice(i, 1);
          state.lives--;
          state.invincible = 60;
          updateUI();
          if (state.lives <= 0) {
            state.gameOver = true;
          }
          break;
        }
      }
    }

    // --- Move particles ---
    for (var i = state.particles.length - 1; i >= 0; i--) {
      var pt = state.particles[i];
      pt.x += pt.vx;
      pt.y += pt.vy;
      pt.vx *= 0.95;
      pt.vy *= 0.95;
      pt.life--;
      if (pt.life <= 0) {
        state.particles.splice(i, 1);
      }
    }

    // --- Move stars ---
    for (var i = 0; i < state.stars.length; i++) {
      var s = state.stars[i];
      s.y += s.speed;
      if (s.y > H) {
        s.y = 0;
        s.x = Math.random() * W;
      }
    }
  }

  // ============ UI ============
  function updateUI() {
    var lives = state.lives;
    if (lives < 0) lives = 0;
    scoreSpan.textContent = '得分: ' + state.score;
    var hearts = '';
    for (var i = 0; i < lives; i++) hearts += '❤';
    livesSpan.textContent = hearts;
  }

  // ============ Draw ============
  function draw() {
    // --- Background ---
    var grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#050510');
    grad.addColorStop(0.5, '#0a0a2e');
    grad.addColorStop(1, '#050510');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // --- Stars ---
    for (var i = 0; i < state.stars.length; i++) {
      var s = state.stars[i];
      var alpha = s.bright * (0.6 + 0.4 * Math.sin(state.frame * 0.02 + s.x));
      ctx.globalAlpha = alpha;
      ctx.fillStyle = '#c8dcff';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // --- Particles / Explosions ---
    for (var i = 0; i < state.particles.length; i++) {
      var pt = state.particles[i];
      var alpha = Math.max(0, pt.life / pt.maxLife);
      ctx.globalAlpha = alpha;
      var r = pt.r, g = pt.g, b = pt.b;
      ctx.fillStyle = 'rgb(' + r + ',' + g + ',' + b + ')';
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, pt.size * alpha, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // --- Player ---
    if (!state.gameOver) {
      var p = state.player;
      // Flash when invincible
      if (state.invincible > 0 && Math.floor(state.invincible / 3) % 2 === 0) {
        ctx.globalAlpha = 0.35;
      }
      drawPlayer(p);
      ctx.globalAlpha = 1;
    }

    // --- Bullets ---
    for (var i = 0; i < state.bullets.length; i++) {
      var b = state.bullets[i];
      var gradB = ctx.createLinearGradient(b.x, b.y - b.h/2, b.x, b.y + b.h/2);
      gradB.addColorStop(0, '#ffffff');
      gradB.addColorStop(0.3, '#66ddff');
      gradB.addColorStop(1, '#2266cc');
      ctx.shadowColor = '#66ddff';
      ctx.shadowBlur = 8;
      ctx.fillStyle = gradB;
      ctx.fillRect(b.x - b.w/2, b.y - b.h/2, b.w, b.h);
      ctx.shadowBlur = 0;
    }

    // --- Enemies ---
    for (var i = 0; i < state.enemies.length; i++) {
      drawEnemy(state.enemies[i]);
    }

    // --- Game Over ---
    if (state.gameOver) {
      ctx.fillStyle = 'rgba(0,0,0,0.7)';
      ctx.fillRect(0, 0, W, H);

      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      ctx.shadowColor = '#ff0000';
      ctx.shadowBlur = 40;
      ctx.fillStyle = '#ff2222';
      ctx.font = 'bold 64px Arial, sans-serif';
      ctx.fillText('GAME OVER', W/2, H/2 - 50);

      ctx.shadowBlur = 0;
      ctx.fillStyle = '#ffcc00';
      ctx.font = '28px Arial, sans-serif';
      ctx.fillText('最终得分: ' + state.score, W/2, H/2 + 30);

      ctx.fillStyle = '#88ccff';
      ctx.font = '18px Arial, sans-serif';
      ctx.fillText('按 R 键或点击按钮重新开始', W/2, H/2 + 90);
    }
  }

  // ============ Draw Player ============
  function drawPlayer(p) {
    var cx = p.x, cy = p.y;
    var hw = p.w/2, hh = p.h/2;

    // Engine glow (circle, no ellipse)
    ctx.shadowColor = '#3399ff';
    ctx.shadowBlur = 25;
    ctx.fillStyle = '#3399ff';
    ctx.beginPath();
    ctx.arc(cx, cy + hh - 2, 10, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    // Main body (polygon fighter shape)
    ctx.shadowColor = '#3399ff';
    ctx.shadowBlur = 12;
    ctx.fillStyle = '#1a5cad';
    ctx.beginPath();
    ctx.moveTo(cx, cy - hh);               // nose
    ctx.lineTo(cx - hw, cy - 2);           // left wing
    ctx.lineTo(cx - hw - 4, cy + 6);       // left tip
    ctx.lineTo(cx - hw/2 + 2, cy + 8);     // left body
    ctx.lineTo(cx - hw/2 + 2, cy + hh - 4);// left tail
    ctx.lineTo(cx - 4, cy + hh - 6);       // center left
    ctx.lineTo(cx + 4, cy + hh - 6);       // center right
    ctx.lineTo(cx + hw/2 - 2, cy + hh - 4);// right tail
    ctx.lineTo(cx + hw/2 - 2, cy + 8);     // right body
    ctx.lineTo(cx + hw + 4, cy + 6);       // right tip
    ctx.lineTo(cx + hw, cy - 2);           // right wing
    ctx.closePath();
    ctx.fill();

    // Fuselage center line
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#3a8cff';
    ctx.beginPath();
    ctx.moveTo(cx, cy - hh + 4);
    ctx.lineTo(cx - 4, cy + 4);
    ctx.lineTo(cx + 4, cy + 4);
    ctx.closePath();
    ctx.fill();

    // Cockpit (circle)
    ctx.fillStyle = '#5ab0ff';
    ctx.beginPath();
    ctx.arc(cx, cy - hh/3, 6, 0, Math.PI * 2);
    ctx.fill();

    // Wing dots (circles instead of ellipses)
    ctx.fillStyle = '#ff8800';
    ctx.beginPath();
    ctx.arc(cx - hw/2, cy + 4, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(cx + hw/2, cy + 4, 3, 0, Math.PI * 2);
    ctx.fill();

    ctx.shadowBlur = 0;
  }

  // ============ Draw Enemy ============
  function drawEnemy(e) {
    var cx = e.x, cy = e.y;
    var hw = e.w/2, hh = e.h/2;

    ctx.shadowColor = '#ff3333';
    ctx.shadowBlur = 8;

    if (e.type === 'triangle') {
      // Red triangle
      ctx.fillStyle = '#cc2222';
      ctx.beginPath();
      ctx.moveTo(cx, cy - hh);
      ctx.lineTo(cx - hw, cy + hh);
      ctx.lineTo(cx + hw, cy + hh);
      ctx.closePath();
      ctx.fill();

      // Inner triangle
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#ff4444';
      ctx.beginPath();
      ctx.moveTo(cx, cy - hh/2);
      ctx.lineTo(cx - hw/2, cy + hh/2);
      ctx.lineTo(cx + hw/2, cy + hh/2);
      ctx.closePath();
      ctx.fill();
    } else {
      // Diamond shape
      ctx.fillStyle = '#dd3333';
      ctx.beginPath();
      ctx.moveTo(cx, cy - hh);
      ctx.lineTo(cx + hw, cy);
      ctx.lineTo(cx, cy + hh);
      ctx.lineTo(cx - hw, cy);
      ctx.closePath();
      ctx.fill();

      // Inner diamond
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#ff5555';
      ctx.beginPath();
      ctx.moveTo(cx, cy - hh/2);
      ctx.lineTo(cx + hw/2, cy);
      ctx.lineTo(cx, cy + hh/2);
      ctx.lineTo(cx - hw/2, cy);
      ctx.closePath();
      ctx.fill();

      // Center dot
      ctx.fillStyle = '#ffcc00';
      ctx.beginPath();
      ctx.arc(cx, cy, 3, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.shadowBlur = 0;
  }

  // ============ Game Loop ============
  function gameLoop() {
    try {
      update();
      draw();
    } catch (err) {
      console.error('Game error:', err);
      // Try to recover: restart on next frame
      if (!state.gameOver) {
        state.gameOver = true;
      }
    }
    requestAnimationFrame(gameLoop);
  }

  // ============ Init ============
  initStars();
  state.player = makePlayer();
  updateUI();
  gameLoop();

})();
</script>
</body>
</html>
