<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>雷霆战机 - Thunder Fighter</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a1a;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    min-height: 100dvh;
    font-family: 'Segoe UI', 'Arial', sans-serif;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    overflow: hidden;
    touch-action: none;
  }
  .game-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    width: 100%;
    max-width: 820px;
    padding: 8px;
  }
  .canvas-wrap {
    position: relative;
    width: 100%;
    max-width: 800px;
    aspect-ratio: 800 / 600;
    touch-action: none;
  }
  canvas {
    width: 100%;
    height: 100%;
    display: block;
    border: 2px solid #3399ff;
    border-radius: 8px;
    box-shadow: 0 0 40px rgba(51,153,255,0.3);
    cursor: none;
    touch-action: none;
  }
  /* Touch indicator ring */
  #touchIndicator {
    position: absolute;
    pointer-events: none;
    border: 2px solid rgba(102, 221, 255, 0.5);
    border-radius: 50%;
    width: 50px;
    height: 50px;
    transform: translate(-50%, -50%);
    display: none;
    box-shadow: 0 0 20px rgba(102, 221, 255, 0.2);
    transition: width 0.15s, height 0.15s, opacity 0.15s;
    z-index: 10;
  }
  #touchIndicator.active {
    display: block;
  }
  .info-bar {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: #88ccff;
    font-size: 14px;
    padding: 0 4px;
  }
  .info-bar .atk-bar {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .info-bar .atk-bar .atk-label {
    color: #66ddff;
    font-size: 12px;
  }
  .info-bar .atk-bar .atk-pips {
    display: flex;
    gap: 3px;
  }
  .info-bar .atk-bar .atk-pip {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    border: 1px solid #3399ff;
    background: transparent;
    transition: all 0.2s;
  }
  .info-bar .atk-bar .atk-pip.filled {
    background: #66ddff;
    box-shadow: 0 0 6px #66ddff;
  }
  .controls {
    color: #6699aa;
    font-size: 13px;
    letter-spacing: 0.5px;
    text-align: center;
  }
  .controls kbd {
    background: #1a2a3a;
    color: #66ddff;
    padding: 2px 8px;
    border-radius: 4px;
    border: 1px solid #335566;
    font-size: 12px;
  }
  .restart-btn {
    background: #1a2a3a;
    color: #66ddff;
    border: 1px solid #3399ff;
    padding: 6px 20px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    transition: all 0.2s;
  }
  .restart-btn:hover {
    background: #1a3a5a;
    box-shadow: 0 0 15px rgba(51,153,255,0.4);
  }

  /* --- Mobile Responsive --- */
  @media (max-width: 840px) {
    .game-wrapper { padding: 4px; gap: 4px; }
    .info-bar { font-size: 12px; padding: 0 2px; }
    .info-bar .atk-bar .atk-pip { width: 8px; height: 8px; }
    .info-bar .atk-bar .atk-label { font-size: 10px; }
    .controls { font-size: 11px; }
    .controls kbd { font-size: 10px; padding: 1px 5px; }
    .restart-btn { font-size: 11px; padding: 4px 14px; }
  }
  @media (max-width: 600px) {
    body { align-items: stretch; padding: 0; }
    .game-wrapper {
      padding: 3px;
      gap: 3px;
      max-width: 100%;
      height: 100dvh;
      height: 100vh;
      justify-content: flex-start;
    }
    .canvas-wrap {
      flex: 1;
      max-width: 100%;
      min-height: 0;
      aspect-ratio: auto;
    }
    .canvas-wrap canvas {
      width: 100%;
      height: 100%;
      border-radius: 4px;
      border-width: 1px;
    }
    .info-bar {
      font-size: 10px;
      flex-shrink: 0;
      padding: 0 2px;
    }
    .info-bar .atk-bar .atk-pip { width: 6px; height: 6px; }
    .controls {
      font-size: 10px;
      flex-shrink: 0;
      line-height: 1.3;
    }
    .restart-btn { font-size: 10px; padding: 3px 10px; }
    .controls .desktop-only { display: none; }
  }
  @media (max-width: 400px) {
    .game-wrapper { padding: 2px; gap: 2px; }
    .info-bar { font-size: 9px; }
    .controls { font-size: 9px; }
    .restart-btn { font-size: 9px; padding: 2px 8px; }
  }
  @media (pointer: coarse) {
    canvas { cursor: default; }
    .controls kbd { display: none; }
  }
</style>
</head>
<body>
<div class="game-wrapper">
  <div class="info-bar">
    <span id="scoreDisplay">得分: 0</span>
    <div class="atk-bar">
      <span class="atk-label">⚡火力</span>
      <span class="atk-pips" id="atkPips"></span>
    </div>
    <span><span id="shieldDisplay"></span><span id="livesDisplay">❤❤❤</span></span>
  </div>
  <div class="canvas-wrap" id="canvasWrap">
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div id="touchIndicator"></div>
  </div>
  <div class="controls">
    <span class="desktop-only"><kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd> 或 <kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> 移动 &nbsp;|&nbsp;</span>
    <kbd>R</kbd> 重新开始 &nbsp;|&nbsp;
    <button class="restart-btn" id="restartBtn">✈ 重新开始</button>
  </div>
</div>
<script>
(function() {
  'use strict';

  // ===================== DOM =====================
  var canvas = document.getElementById('gameCanvas');
  var ctx = canvas.getContext('2d');
  var scoreSpan = document.getElementById('scoreDisplay');
  var livesSpan = document.getElementById('livesDisplay');
  var atkPips = document.getElementById('atkPips');

  var W = 800, H = 600;
  var MAX_ATK = 6;

  // ===================== State =====================
  var state = {
    player: null,
    bullets: [],
    enemyBullets: [],
    enemies: [],
    orbs: [],
    particles: [],
    stars: [],
    score: 0,
    lives: 3,
    maxLives: 3,
    attackLevel: 0,
    invincible: 0,
    gameOver: false,
    frame: 0,
    shootCooldown: 0,
    eliteThreshold: 100,
    bossThreshold: 1000,
    yellowTimer: 0,
    boss: null,
    followers: [],
    shield: 0,
    skillCooldown: 0,
    skillReady: false,
    levelUpText: 0,
    running: true
  };

  // ===================== Keys =====================
  var keys = {};
  window.addEventListener('keydown', function(e) {
    keys[e.key] = true;
    if (e.key === 'r' || e.key === 'R') restartGame();
    if (e.key === 'ArrowUp' || e.key === 'ArrowDown' ||
        e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === ' ') e.preventDefault();
  });
  window.addEventListener('keyup', function(e) { keys[e.key] = false; });
  document.getElementById('restartBtn').addEventListener('click', restartGame);

  // ===================== Touch Controls =====================
  var touchActive = false;
  var touchX = 0, touchY = 0;
  var touchId = null;
  var touchIndicator = document.getElementById('touchIndicator');
  var canvasWrap = document.getElementById('canvasWrap');

  function getCanvasCoords(clientX, clientY) {
    var rect = canvas.getBoundingClientRect();
    return {
      x: (clientX - rect.left) * (W / rect.width),
      y: (clientY - rect.top) * (H / rect.height)
    };
  }

  function showTouchIndicator(x, y) {
    touchIndicator.style.left = x + 'px';
    touchIndicator.style.top = y + 'px';
    touchIndicator.classList.add('active');
  }

  function hideTouchIndicator() {
    touchIndicator.classList.remove('active');
  }

  canvas.addEventListener('touchstart', function(e) {
    e.preventDefault();

    // Tap to restart on game over
    if (state.gameOver) {
      restartGame();
      return;
    }

    // Multi-touch: second finger triggers skill
    if (touchActive || state.touchCount > 0) {
      activateShockwave();
      return;
    }

    var touch = e.changedTouches[0];
    touchId = touch.identifier;
    state.touchCount = (state.touchCount || 0) + 1;
    var coords = getCanvasCoords(touch.clientX, touch.clientY);
    touchX = coords.x;
    touchY = coords.y;
    touchActive = true;

    var rect = canvas.getBoundingClientRect();
    showTouchIndicator(
      touch.clientX - rect.left,
      touch.clientY - rect.top
    );
  }, { passive: false });

  canvas.addEventListener('touchmove', function(e) {
    e.preventDefault();
    for (var i = 0; i < e.changedTouches.length; i++) {
      var touch = e.changedTouches[i];
      if (touch.identifier === touchId) {
        var coords = getCanvasCoords(touch.clientX, touch.clientY);
        touchX = coords.x;
        touchY = coords.y;

        var rect = canvas.getBoundingClientRect();
        showTouchIndicator(
          touch.clientX - rect.left,
          touch.clientY - rect.top
        );
        break;
      }
    }
  }, { passive: false });

  canvas.addEventListener('touchend', function(e) {
    state.touchCount = Math.max(0, (state.touchCount || 0) - e.changedTouches.length);
    for (var i = 0; i < e.changedTouches.length; i++) {
      if (e.changedTouches[i].identifier === touchId) {
        touchActive = false;
        touchId = null;
        hideTouchIndicator();
        break;
      }
    }
  });

  canvas.addEventListener('touchcancel', function(e) {
    touchActive = false;
    touchId = null;
    state.touchCount = 0;
    hideTouchIndicator();
  });

  // Click/tap on canvas to restart on game over (for mouse/desktop)
  canvas.addEventListener('click', function() {
    if (state.gameOver) restartGame();
  });

  // ===================== Player =====================
  function makePlayer() { return { x: W/2, y: H-60, w: 28, h: 34 }; }

  // ===================== Attack Patterns =====================
  function getAttackPattern(level) {
    var spd = 9.5;
    if (level <= 0) return [{ ox: 0, dx: 0, dy: -spd }];

    if (level === 1) return [
      { ox: -4, dx: -1.2, dy: -spd },
      { ox: 4, dx: 1.2, dy: -spd }
    ];
    if (level === 2) return [
      { ox: -7, dx: -2.5, dy: -spd },
      { ox: 0, dx: 0, dy: -spd },
      { ox: 7, dx: 2.5, dy: -spd }
    ];
    if (level === 3) return [
      { ox: -10, dx: -3.5, dy: -spd },
      { ox: -5, dx: -1.8, dy: -spd },
      { ox: 0, dx: 0, dy: -spd },
      { ox: 5, dx: 1.8, dy: -spd },
      { ox: 10, dx: 3.5, dy: -spd }
    ];
    if (level === 4) return [
      { ox: -12, dx: -4.5, dy: -spd },
      { ox: -7, dx: -2.5, dy: -spd },
      { ox: 0, dx: 0, dy: -spd },
      { ox: 7, dx: 2.5, dy: -spd },
      { ox: 12, dx: 4.5, dy: -spd },
      { ox: -20, dx: -6, dy: -7 },
      { ox: 20, dx: 6, dy: -7 }
    ];
    // level 5+
    return [
      { ox: -15, dx: -5.5, dy: -spd },
      { ox: -10, dx: -3.5, dy: -spd },
      { ox: -5, dx: -1.5, dy: -spd },
      { ox: 0, dx: 0, dy: -spd },
      { ox: 5, dx: 1.5, dy: -spd },
      { ox: 10, dx: 3.5, dy: -spd },
      { ox: 15, dx: 5.5, dy: -spd },
      { ox: -24, dx: -7.5, dy: -6 },
      { ox: 24, dx: 7.5, dy: -6 }
    ];
  }

  // ===================== Enemy Type Config =====================
  var ENEMY_TYPES = [
    { id: 'basic',   minScore: 0,   hp: 1, speed: [0.8, 1.8], size: [14, 24], weight: 45, color: 'red' },
    { id: 'fast',    minScore: 100, hp: 1, speed: [2.2, 3.8], size: [10, 16], weight: 22, color: 'orange' },
    { id: 'tank',    minScore: 200, hp: 3, speed: [0.5, 1.0], size: [26, 36], weight: 15, color: 'darkred' },
    { id: 'shooter', minScore: 300, hp: 1, speed: [0.8, 1.5], size: [16, 24], weight: 18, color: 'magenta' },
    { id: 'waver',   minScore: 400, hp: 1, speed: [0.9, 1.6], size: [14, 22], weight: 16, color: 'cyan' },
    { id: 'splitter',minScore: 500, hp: 2, speed: [0.8, 1.5], size: [18, 26], weight: 12, color: 'green' },
  ];

  function getEnemyPool() {
    var pool = [];
    for (var i = 0; i < ENEMY_TYPES.length; i++) {
      if (state.score >= ENEMY_TYPES[i].minScore) {
        for (var w = 0; w < ENEMY_TYPES[i].weight; w++) pool.push(ENEMY_TYPES[i]);
      }
    }
    return pool;
  }

  // ===================== Entity Spawners =====================
  function spawnPlayerBullets() {
    if (state.bullets.length >= 50) return;
    var p = state.player;
    var pattern = getAttackPattern(state.attackLevel);
    for (var i = 0; i < pattern.length; i++) {
      var b = pattern[i];
      state.bullets.push({
        x: p.x + b.ox,
        y: p.y - p.h/2 - 6,
        vx: b.dx,
        vy: b.dy,
        w: 4,
        h: 10
      });
    }
  }

  function pickEnemyType() {
    var pool = getEnemyPool();
    return pool[Math.floor(Math.random() * pool.length)];
  }

  function spawnEnemy() {
    if (state.enemies.length >= 25) return;
    var cfg = pickEnemyType();
    var size = cfg.size[0] + Math.random() * (cfg.size[1] - cfg.size[0]);
    var spd = cfg.speed[0] + Math.random() * (cfg.speed[1] - cfg.speed[0]);
    state.enemies.push({
      x: Math.random() * (W - size) + size/2,
      y: -size,
      w: size,
      h: size,
      speed: spd,
      type: cfg.id,
      hp: cfg.hp,
      maxHp: cfg.hp,
      color: cfg.color,
      timer: 0,
      oscPhase: Math.random() * Math.PI * 2,
      oscSpeed: 0.03 + Math.random() * 0.02,
      oscRange: 30 + Math.random() * 30,
      baseX: 0,
      shootTimer: 40 + Math.floor(Math.random() * 40),
      flash: 0
    });
  }

  function spawnSplitMinion(x, y) {
    var size = 10 + Math.random() * 4;
    var offX = (Math.random() - 0.5) * 20;
    state.enemies.push({
      x: x + offX, y: y,
      w: size, h: size,
      speed: 1.5 + Math.random(),
      type: 'basic',
      hp: 1, maxHp: 1,
      color: 'green',
      timer: 0, oscPhase: 0, oscSpeed: 0, oscRange: 0, baseX: 0,
      shootTimer: 999,
      flash: 0
    });
  }

  function spawnElite(milestone) {
    var level = milestone / 100;
    var size = 26 + Math.min(level, 10) * 2;
    var hp = 3 + Math.floor(level * 2);
    var pattern = Math.floor(Math.random() * 3); // 0=aimed, 1=spread, 2=mixed
    state.enemies.push({
      x: Math.random() * (W - size * 2) + size,
      y: -size - 10,
      w: size, h: size,
      speed: 0.6 + Math.min(level, 8) * 0.12,
      type: 'elite',
      hp: hp, maxHp: hp,
      color: 'purple',
      timer: 0, oscPhase: 0, oscSpeed: 0,
      oscRange: 50 + Math.min(level, 10) * 5,
      baseX: 0,
      shootTimer: 40 + Math.floor(Math.random() * 20),
      flash: 0,
      pattern: pattern,
      patternCounter: 0
    });
    var e = state.enemies[state.enemies.length - 1];
    e.baseX = e.x;
    e.oscSpeed = 0.018 + Math.random() * 0.015;
  }

  function spawnBoss(milestone) {
    var level = milestone / 1000;
    var hp = 40 + Math.floor(level * 30);
    state.boss = {
      x: W/2, y: -70,
      w: 80 + Math.min(level, 10) * 6,
      h: 60 + Math.min(level, 10) * 4,
      hp: hp, maxHp: hp,
      speed: 1.5 + Math.min(level, 5) * 0.2,
      dir: 1,
      state: 'entering',
      targetY: 70,
      shootTimer: 50,
      spawnTimer: 150,
      level: level,
      flash: 0,
      phase: 1,
      patternTimer: 0
    };
  }

  function spawnEnemyBullet(x, y, vx, vy) {
    if (state.enemyBullets.length >= 80) return;
    state.enemyBullets.push({ x: x, y: y, vx: vx, vy: vy, w: 6, h: 6 });
  }

  function spawnOrb(type, x, y) {
    if (state.orbs.length >= 15) return;
    state.orbs.push({
      x: x, y: y, w: 10, h: 10,
      vy: 0.6 + Math.random() * 0.3,
      type: type,
      timer: Math.random() * 100
    });
  }

  function dropOrb(x, y, fromType) {
    if (fromType === 'elite') {
      spawnOrb('blue', x, y);
      if (Math.random() < 0.55) spawnOrb('blue', x + (Math.random()-0.5)*20, y);
    } else if (fromType === 'boss') {
      var count = 4 + Math.floor(Math.random() * 3);
      for (var i = 0; i < count; i++) {
        spawnOrb('blue', x + (Math.random()-0.5)*40, y + (Math.random()-0.5)*20);
      }
    } else if (fromType === 'tank' || fromType === 'splitter') {
      if (Math.random() < 0.25) spawnOrb('blue', x, y);
    } else {
      if (Math.random() < 0.10) spawnOrb('blue', x, y);
    }
  }

  // ===================== Level Up Effect =====================
  function spawnLevelUpEffect(x, y) {
    // Expanding ring
    state.particles.push({
      x: x, y: y, vx: 0, vy: 0,
      life: 40, maxLife: 40,
      size: 2, r: 102, g: 221, b: 255,
      isRing: true, ringRadius: 0
    });
    // Big burst
    for (var i = 0; i < 30; i++) {
      var angle = Math.random() * Math.PI * 2;
      var spd = 2 + Math.random() * 5;
      state.particles.push({
        x: x, y: y,
        vx: Math.cos(angle) * spd,
        vy: Math.sin(angle) * spd,
        life: 25 + Math.random() * 20,
        maxLife: 45,
        size: 2 + Math.random() * 4,
        r: 100 + Math.floor(Math.random() * 155),
        g: 180 + Math.floor(Math.random() * 75),
        b: 255,
        isRing: false
      });
    }
    state.levelUpText = 50; // show level up text for 50 frames
  }

  // ===================== Follower System =====================
  function spawnFollower() {
    if (state.followers.length >= 5) {
      // Upgrade lowest-level follower
      var lowest = null;
      for (var i = 0; i < state.followers.length; i++) {
        if (!lowest || state.followers[i].level < lowest.level) lowest = state.followers[i];
      }
      if (lowest) {
        lowest.level++;
        lowest.shootTimer = 0;
        spawnLevelUpEffect(lowest.x, lowest.y);
      }
      return;
    }
    var angle = (state.followers.length / 5) * Math.PI * 2;
    state.followers.push({
      x: state.player.x, y: state.player.y,
      angle: angle,
      orbitSpeed: 0.03 + Math.random() * 0.02,
      orbitRadius: 40 + state.followers.length * 8,
      level: 1,
      shootTimer: Math.floor(Math.random() * 30)
    });
    spawnLevelUpEffect(state.player.x, state.player.y - 20);
  }

  function removeFollower() {
    if (state.followers.length === 0) return;
    // Remove highest level follower (most valuable)
    var highest = null;
    var idx = -1;
    for (var i = 0; i < state.followers.length; i++) {
      if (!highest || state.followers[i].level > highest.level) {
        highest = state.followers[i];
        idx = i;
      }
    }
    if (idx >= 0) {
      spawnExplosion(state.followers[idx].x, state.followers[idx].y, 20, 'blue');
      state.followers.splice(idx, 1);
    }
  }

  // ===================== Skill: Shockwave =====================
  function activateShockwave() {
    if (state.skillCooldown > 0) return;
    state.skillCooldown = 180; // 3 seconds
    state.skillReady = false;

    var cx = state.player.x, cy = state.player.y;

    // Visual: big expanding ring
    state.particles.push({
      x: cx, y: cy, vx: 0, vy: 0,
      life: 30, maxLife: 30,
      size: 3, r: 150, g: 220, b: 255,
      isRing: true, ringRadius: 0
    });

    // Second ring
    state.particles.push({
      x: cx, y: cy, vx: 0, vy: 0,
      life: 25, maxLife: 25,
      size: 2, r: 255, g: 255, b: 255,
      isRing: true, ringRadius: 0
    });

    // Burst particles
    for (var i = 0; i < 40; i++) {
      var angle = Math.random() * Math.PI * 2;
      var spd = 3 + Math.random() * 6;
      state.particles.push({
        x: cx, y: cy,
        vx: Math.cos(angle) * spd, vy: Math.sin(angle) * spd,
        life: 15 + Math.random() * 15, maxLife: 30,
        size: 2 + Math.random() * 3,
        r: 100 + Math.floor(Math.random() * 155),
        g: 200 + Math.floor(Math.random() * 55),
        b: 255, isRing: false
      });
    }

    // Damage enemies in range
    var shockRadius = 180;
    for (var i = state.enemies.length - 1; i >= 0; i--) {
      var e = state.enemies[i];
      var dx = e.x - cx, dy = e.y - cy;
      var dist = Math.sqrt(dx*dx + dy*dy);
      if (dist < shockRadius) {
        var dmg = 2;
        e.hp -= dmg;
        // Push enemy away
        if (dist > 1) {
          e.x += (dx / dist) * 40;
          e.y += (dy / dist) * 40;
        }
        if (e.hp <= 0) {
          spawnExplosion(e.x, e.y, e.w, e.type === 'elite' ? 'purple' : 'orange');
          dropOrb(e.x, e.y, e.type === 'elite' ? 'elite' : e.type);
          addKillScore(e.type === 'tank' ? 20 : (e.type === 'splitter' ? 15 : 10));
          state.enemies.splice(i, 1);
        } else {
          e.flash = 8;
        }
      }
    }

    // Destroy enemy bullets in range
    for (var i = state.enemyBullets.length - 1; i >= 0; i--) {
      var eb = state.enemyBullets[i];
      var dx = eb.x - cx, dy = eb.y - cy;
      if (Math.sqrt(dx*dx + dy*dy) < shockRadius) {
        spawnExplosion(eb.x, eb.y, 8, 'blue');
        state.enemyBullets.splice(i, 1);
      }
    }

    // Damage boss
    if (state.boss) {
      var boss = state.boss;
      var dx = boss.x - cx, dy = boss.y - cy;
      if (Math.sqrt(dx*dx + dy*dy) < shockRadius + boss.w/2) {
        boss.hp -= 3;
        boss.flash = 10;
        if (boss.hp <= 0) {
          spawnExplosion(boss.x, boss.y, boss.w, 'boss');
          for (var k = 0; k < 5; k++) {
            (function() { var delay = k; setTimeout(function() {
              if (!state.gameOver) spawnExplosion(
                boss.x + (Math.random()-0.5)*60, boss.y + (Math.random()-0.5)*40, boss.w/2, 'boss'
              );
            }, delay * 100); })();
          }
          dropOrb(boss.x, boss.y, 'boss');
          addKillScore(200);
          state.boss = null;
        }
      }
    }
  }

  // ===================== Heart & Shield Items =====================
  function spawnHeart() {
    if (state.orbs.length >= 20) return;
    state.orbs.push({
      x: 30 + Math.random() * (W - 60), y: -10,
      w: 14, h: 14, vy: 0.5 + Math.random() * 0.2,
      type: 'heart', timer: Math.random() * 100
    });
  }

  function spawnShieldItem() {
    if (state.orbs.length >= 20) return;
    state.orbs.push({
      x: 30 + Math.random() * (W - 60), y: -10,
      w: 14, h: 14, vy: 0.5 + Math.random() * 0.2,
      type: 'shield', timer: Math.random() * 100
    });
  }

  // ===================== Particles =====================
  function spawnExplosion(x, y, size, color) {
    var count = 6 + Math.floor(size / 4);
    var cr = 255, cg = 100, cb = 0;
    if (color === 'blue') { cr = 50; cg = 150; cb = 255; }
    else if (color === 'yellow') { cr = 255; cg = 255; cb = 100; }
    else if (color === 'purple') { cr = 200; cg = 50; cb = 255; }
    else if (color === 'boss') { cr = 255; cg = 50; cb = 50; }
    for (var i = 0; i < count; i++) {
      var angle = Math.random() * Math.PI * 2;
      var spd = 1 + Math.random() * 3;
      state.particles.push({
        x: x, y: y,
        vx: Math.cos(angle) * spd,
        vy: Math.sin(angle) * spd,
        life: 15 + Math.random() * 20,
        maxLife: 35,
        size: 2 + Math.random() * 3,
        r: cr + Math.floor(Math.random() * 60 - 30),
        g: cg + Math.floor(Math.random() * 60 - 30),
        b: cb + Math.floor(Math.random() * 60 - 30)
      });
    }
  }

  // ===================== Score =====================
  function addKillScore(points) {
    state.score += points;
    checkThresholds();
    updateUI();
  }

  function addBonusScore(points) {
    state.score += points;
    updateUI();
  }

  function checkThresholds() {
    var spawned = false;
    while (state.score >= state.eliteThreshold) {
      spawnElite(state.eliteThreshold);
      state.eliteThreshold += 100;
      spawned = true;
    }
    while (state.score >= state.bossThreshold) {
      spawnBoss(state.bossThreshold);
      state.bossThreshold += 1000;
      spawned = true;
    }
  }

  // ===================== Stars =====================
  function initStars() {
    state.stars = [];
    for (var i = 0; i < 100; i++) {
      state.stars.push({
        x: Math.random() * W, y: Math.random() * H,
        speed: 0.3 + Math.random() * 0.8,
        size: 0.5 + Math.random() * 1.5,
        bright: 0.3 + Math.random() * 0.7
      });
    }
  }

  // ===================== Lifecycle =====================
  function restartGame() {
    for (var k in keys) keys[k] = false;
    state.player = makePlayer();
    state.bullets = [];
    state.enemyBullets = [];
    state.enemies = [];
    state.orbs = [];
    state.particles = [];
    state.score = 0;
    state.lives = state.maxLives;
    state.attackLevel = 0;
    state.invincible = 0;
    state.gameOver = false;
    state.frame = 0;
    state.shootCooldown = 0;
    state.eliteThreshold = 150;
    state.bossThreshold = 1000;
    state.yellowTimer = 0;
    state.boss = null;
    state.followers = [];
    state.shield = 0;
    state.skillCooldown = 0;
    state.skillReady = false;
    state.levelUpText = 0;
    state.running = true;
    state.touchCount = 0;
    initStars();
    updateUI();
  }

  // ===================== Update =====================
  function update() {
    if (state.gameOver) return;
    state.frame++;

    // --- Player movement (keyboard + touch) ---
    var p = state.player;
    if (touchActive) {
      var dx = touchX - p.x;
      var dy = touchY - p.y;
      var dist = Math.sqrt(dx*dx + dy*dy);
      if (dist > 5) {
        var moveSpd = Math.min(7, dist * 0.15 + 3);
        p.x += (dx / dist) * moveSpd;
        p.y += (dy / dist) * moveSpd;
      }
    } else {
      if (keys['ArrowLeft'] || keys['a'] || keys['A']) p.x -= 5;
      if (keys['ArrowRight'] || keys['d'] || keys['D']) p.x += 5;
      if (keys['ArrowUp'] || keys['w'] || keys['W']) p.y -= 5;
      if (keys['ArrowDown'] || keys['s'] || keys['S']) p.y += 5;
    }
    // Clamp
    if (p.x < p.w/2) p.x = p.w/2;
    if (p.x > W - p.w/2) p.x = W - p.w/2;
    if (p.y < p.h/2) p.y = p.h/2;
    if (p.y > H - p.h/2) p.y = H - p.h/2;

    if (state.invincible > 0) state.invincible--;

    // --- Shoot ---
    var cooldown = Math.max(5, 12 - state.attackLevel);
    if (state.shootCooldown <= 0) {
      spawnPlayerBullets();
      state.shootCooldown = cooldown;
    } else {
      state.shootCooldown--;
    }

    // --- Spawn enemies (dynamic rate based on score) ---
    var spawnInterval = Math.max(18, 50 - Math.floor(state.score / 40));
    if (state.frame % spawnInterval === 0) spawnEnemy();

    // --- Yellow orb spawn ---
    state.yellowTimer++;
    if (state.yellowTimer >= 400 + Math.floor(Math.random() * 200)) {
      state.yellowTimer = 0;
      spawnOrb('yellow', 30 + Math.random() * (W - 60), -10);
    }

    // --- Heart spawn (every ~600 frames) ---
    if (state.frame % 600 === 0 && state.lives < state.maxLives) {
      if (Math.random() < 0.4) spawnHeart();
    }

    // --- Shield spawn (every ~800 frames) ---
    if (state.frame % 800 === 0 && state.shield <= 0) {
      if (Math.random() < 0.35) spawnShieldItem();
    }

    // --- Skill cooldown ---
    if (state.skillCooldown > 0) {
      state.skillCooldown--;
      if (state.skillCooldown <= 0) state.skillReady = true;
    }

    // --- Follower update ---
    for (var i = 0; i < state.followers.length; i++) {
      var f = state.followers[i];
      f.angle += f.orbitSpeed;
      f.x = state.player.x + Math.cos(f.angle) * f.orbitRadius;
      f.y = state.player.y + Math.sin(f.angle) * f.orbitRadius;
      // Follower shoots
      f.shootTimer--;
      if (f.shootTimer <= 0) {
        var fireRate = Math.max(10, 40 - f.level * 6);
        // Find nearest enemy
        var nearest = null, nearDist = Infinity;
        for (var ei = 0; ei < state.enemies.length; ei++) {
          var dx = state.enemies[ei].x - f.x;
          var dy = state.enemies[ei].y - f.y;
          var d = Math.sqrt(dx*dx + dy*dy);
          if (d < nearDist) { nearDist = d; nearest = state.enemies[ei]; }
        }
        var aimX = nearest ? nearest.x : f.x;
        var aimY = nearest ? (nearest.y + nearest.h/2) : f.y - 100;
        var dx = aimX - f.x, dy = aimY - f.y;
        var len = Math.sqrt(dx*dx + dy*dy);
        if (len > 0 && state.bullets.length < 60) {
          state.bullets.push({
            x: f.x, y: f.y,
            vx: dx/len * 8, vy: dy/len * 8,
            w: 3, h: 6
          });
        }
        f.shootTimer = fireRate + Math.floor(Math.random() * 10);
      }
    }

    // --- Skill activation (E key) ---
    if (keys['e'] || keys['E']) {
      keys['e'] = false;
      keys['E'] = false;
      activateShockwave();
    }

    // --- Level up text timer ---
    if (state.levelUpText > 0) state.levelUpText--;

    // --- Move player bullets ---
    for (var i = state.bullets.length - 1; i >= 0; i--) {
      var b = state.bullets[i];
      b.x += b.vx;
      b.y += b.vy;
      if (b.y + b.h < 0 || b.y > H || b.x < -20 || b.x > W + 20) {
        state.bullets.splice(i, 1);
      }
    }

    // --- Move enemy bullets ---
    for (var i = state.enemyBullets.length - 1; i >= 0; i--) {
      var eb = state.enemyBullets[i];
      eb.x += eb.vx;
      eb.y += eb.vy;
      if (eb.y > H + 20 || eb.y < -20 || eb.x < -20 || eb.x > W + 20) {
        state.enemyBullets.splice(i, 1);
      }
    }

    // --- Move enemies ---
    for (var i = state.enemies.length - 1; i >= 0; i--) {
      var e = state.enemies[i];
      e.timer++;

      if (e.type === 'elite') {
        e.x = e.baseX + Math.sin(state.frame * e.oscSpeed) * e.oscRange;
        e.y += e.speed;
        e.shootTimer--;
        if (e.shootTimer <= 0) {
          var px = state.player.x - e.x;
          var py = state.player.y - e.y;
          var len = Math.sqrt(px*px + py*py);
          if (len > 0) {
            if (e.pattern === 0) {
              // Aimed
              spawnEnemyBullet(e.x, e.y + e.h/2, px/len * 3, py/len * 3);
            } else if (e.pattern === 1) {
              // Spread
              for (var a = -1; a <= 1; a++) {
                var angle = Math.atan2(py, px) + a * 0.3;
                spawnEnemyBullet(e.x, e.y + e.h/2, Math.cos(angle) * 3, Math.sin(angle) * 3);
              }
            } else {
              // Alternating
              e.patternCounter++;
              if (e.patternCounter % 3 === 0) {
                spawnEnemyBullet(e.x, e.y + e.h/2, px/len * 3.5, py/len * 3.5);
              } else {
                for (var a = -1; a <= 1; a++) {
                  var angle = Math.atan2(py, px) + a * 0.25;
                  spawnEnemyBullet(e.x, e.y + e.h/2, Math.cos(angle) * 2.5, Math.sin(angle) * 2.5);
                }
              }
            }
          }
          e.shootTimer = 45 + Math.floor(Math.random() * 30);
        }
      } else if (e.type === 'waver') {
        e.x += Math.sin(state.frame * e.oscSpeed + e.oscPhase) * 2;
        e.y += e.speed;
      } else if (e.type === 'shooter') {
        e.y += e.speed;
        e.shootTimer--;
        if (e.shootTimer <= 0 && e.y > 0 && e.y < H * 0.6) {
          var px = state.player.x - e.x;
          var py = state.player.y - e.y;
          var len = Math.sqrt(px*px + py*py);
          if (len > 0) {
            spawnEnemyBullet(e.x, e.y + e.h/2, px/len * 2.2, py/len * 2.2);
          }
          e.shootTimer = 60 + Math.floor(Math.random() * 40);
        }
      } else {
        e.y += e.speed;
      }
      // Remove off-screen
      if (e.y - e.h > H) {
        state.enemies.splice(i, 1);
      }
      // Flash decay
      if (e.flash > 0) e.flash--;
    }

    // --- Boss update ---
    if (state.boss) {
      var boss = state.boss;
      // Phase transitions based on HP %
      var hpPct = boss.hp / boss.maxHp;
      if (hpPct < 0.5 && boss.phase === 1) boss.phase = 2;
      if (hpPct < 0.25 && boss.phase === 2) boss.phase = 3;

      if (boss.state === 'entering') {
        boss.y += 1.2;
        if (boss.y >= boss.targetY) {
          boss.state = 'sweeping';
          boss.y = boss.targetY;
        }
      } else if (boss.state === 'sweeping') {
        boss.speed = 1.5 + boss.phase * 0.3;
        boss.x += boss.speed * boss.dir;
        if (boss.x > W - boss.w/2) boss.dir = -1;
        if (boss.x < boss.w/2) boss.dir = 1;
        boss.y = boss.targetY + Math.sin(state.frame * 0.025) * (10 + boss.phase * 4);

        // Boss shoot
        boss.shootTimer--;
        if (boss.shootTimer <= 0) {
          if (boss.phase === 1) {
            // Phase 1: spread + aimed
            for (var a = -2; a <= 2; a++) {
              var angle = Math.PI/2 + a * 0.25;
              spawnEnemyBullet(boss.x + Math.cos(angle) * 20, boss.y + boss.h/2,
                Math.cos(angle) * 3, Math.sin(angle) * 3);
            }
            var px = state.player.x - boss.x;
            var py = state.player.y - boss.y;
            var len = Math.sqrt(px*px + py*py);
            if (len > 0) spawnEnemyBullet(boss.x, boss.y + boss.h/2, px/len * 4, py/len * 4);
            boss.shootTimer = 35 + Math.floor(Math.random() * 15);
          } else if (boss.phase === 2) {
            // Phase 2: faster spread + double aimed
            for (var a = -3; a <= 3; a++) {
              if (a === 0) continue;
              var angle = Math.PI/2 + a * 0.18;
              spawnEnemyBullet(boss.x + Math.cos(angle) * 20, boss.y + boss.h/2,
                Math.cos(angle) * 3.2, Math.sin(angle) * 3.2);
            }
            for (var s = -1; s <= 1; s += 2) {
              var px = state.player.x - boss.x + s * 30;
              var py = state.player.y - boss.y;
              var len = Math.sqrt(px*px + py*py);
              if (len > 0) spawnEnemyBullet(boss.x + s*15, boss.y + boss.h/2, px/len * 4.5, py/len * 4.5);
            }
            boss.shootTimer = 28 + Math.floor(Math.random() * 12);
          } else {
            // Phase 3: chaotic - spiral burst
            boss.patternTimer++;
            for (var a = -4; a <= 4; a++) {
              var angle = Math.PI/2 + a * 0.15 + boss.patternTimer * 0.05;
              spawnEnemyBullet(boss.x + Math.cos(angle) * 20, boss.y + boss.h/2,
                Math.cos(angle) * 3.5, Math.sin(angle) * 3.5);
            }
            // Plus aimed
            var px = state.player.x - boss.x;
            var py = state.player.y - boss.y;
            var len = Math.sqrt(px*px + py*py);
            if (len > 0) spawnEnemyBullet(boss.x, boss.y + boss.h/2, px/len * 5, py/len * 5);
            boss.shootTimer = 22 + Math.floor(Math.random() * 10);
          }
        }

        // Boss spawn minions
        boss.spawnTimer--;
        if (boss.spawnTimer <= 0) {
          var count = boss.phase >= 2 ? 2 : 1;
          for (var m = 0; m < count; m++) {
            state.enemies.push({
              x: boss.x + (Math.random()-0.5) * 50,
              y: boss.y + boss.h/2,
              w: 12, h: 12,
              speed: 1.8 + Math.random() * 0.5,
              type: 'basic', hp: 1, maxHp: 1,
              color: 'red', timer: 0, oscPhase: 0,
              oscSpeed: 0, oscRange: 0, baseX: 0,
              shootTimer: 999, flash: 0
            });
          }
          boss.spawnTimer = Math.max(40, 120 - boss.phase * 20) + Math.floor(Math.random() * 40);
        }
      }
      if (boss.flash > 0) boss.flash--;
    }

    // --- Bullet vs Enemy ---
    for (var i = state.bullets.length - 1; i >= 0; i--) {
      var b = state.bullets[i];
      var hit = false;

      // vs enemies
      for (var j = state.enemies.length - 1; j >= 0; j--) {
        var e = state.enemies[j];
        if (b.x > e.x - e.w/2 && b.x < e.x + e.w/2 &&
            b.y > e.y - e.h/2 && b.y < e.y + e.h/2) {
          e.hp--;
          if (e.hp <= 0) {
            var color = e.type === 'elite' ? 'purple' : e.color === 'green' ? 'green' : 'orange';
            spawnExplosion(e.x, e.y, e.w, color);
            // Splitter splits into 2 minions
            if (e.type === 'splitter') {
              spawnSplitMinion(e.x, e.y);
              spawnSplitMinion(e.x, e.y);
            }
            dropOrb(e.x, e.y, e.type === 'elite' ? 'elite' : e.type);
            addKillScore(e.type === 'tank' ? 20 : (e.type === 'splitter' ? 15 : 10));
            state.enemies.splice(j, 1);
          } else {
            e.flash = 4;
          }
          state.bullets.splice(i, 1);
          hit = true;
          break;
        }
      }
      if (hit) continue;

      // vs boss
      if (state.boss) {
        var boss = state.boss;
        if (b.x > boss.x - boss.w/2 && b.x < boss.x + boss.w/2 &&
            b.y > boss.y - boss.h/2 && b.y < boss.y + boss.h/2) {
          boss.hp--;
          boss.flash = 4;
          if (boss.hp <= 0) {
            spawnExplosion(boss.x, boss.y, boss.w, 'boss');
            // Big multi-explosion
            for (var k = 0; k < 5; k++) {
              setTimeout(function() {
                if (!state.gameOver) {
                  spawnExplosion(
                    boss.x + (Math.random()-0.5)*60,
                    boss.y + (Math.random()-0.5)*40,
                    boss.w/2, 'boss'
                  );
                }
              }, k * 100);
            }
            dropOrb(boss.x, boss.y, 'boss');
            addKillScore(200);
            state.boss = null;
          }
          state.bullets.splice(i, 1);
          continue;
        }
      }
    }

    // --- Player damage helper: shield -> follower -> life ---
    function playerTakeDamage() {
      if (state.invincible > 0) return false;
      if (state.shield > 0) {
        state.shield = 0;
        spawnExplosion(p.x, p.y - 20, 25, 'blue');
        state.invincible = 30;
        updateUI();
        return false;
      }
      if (state.followers.length > 0) {
        removeFollower();
        state.invincible = 30;
        updateUI();
        return false;
      }
      state.lives--;
      state.invincible = 60;
      updateUI();
      if (state.lives <= 0) { state.gameOver = true; return true; }
      return true;
    }

    // --- Player vs enemies ---
    if (state.invincible <= 0) {
      for (var i = state.enemies.length - 1; i >= 0; i--) {
        var e = state.enemies[i];
        var dx = p.x - e.x, dy = p.y - e.y;
        var dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < p.w/2 + e.w/2 - 4) {
          spawnExplosion(e.x, e.y, e.w, 'orange');
          state.enemies.splice(i, 1);
          if (playerTakeDamage()) return;
          break;
        }
      }
    }

    // --- Player vs boss ---
    if (state.boss && state.invincible <= 0) {
      var boss = state.boss;
      var dx = p.x - boss.x, dy = p.y - boss.y;
      var dist = Math.sqrt(dx*dx + dy*dy);
      if (dist < p.w/2 + boss.w/2 - 10) {
        boss.flash = 8;
        if (playerTakeDamage()) return;
      }
    }

    // --- Player vs enemy bullets ---
    for (var i = state.enemyBullets.length - 1; i >= 0; i--) {
      var eb = state.enemyBullets[i];
      if (state.invincible > 0) break;
      var dx = p.x - eb.x, dy = p.y - eb.y;
      var dist = Math.sqrt(dx*dx + dy*dy);
      if (dist < p.w/2 + 4) {
        spawnExplosion(eb.x, eb.y, 10, 'red');
        state.enemyBullets.splice(i, 1);
        if (playerTakeDamage()) return;
        break;
      }
    }

    // --- Player vs orbs ---
    for (var i = state.orbs.length - 1; i >= 0; i--) {
      var o = state.orbs[i];
      var dx = p.x - o.x, dy = p.y - o.y;
      var dist = Math.sqrt(dx*dx + dy*dy);
      if (dist < p.w/2 + o.w/2) {
        if (o.type === 'blue') {
          if (state.attackLevel < MAX_ATK) {
            state.attackLevel++;
            spawnLevelUpEffect(o.x, o.y);
            addKillScore(20);
          } else {
            spawnFollower(); // Add/upgrade follower instead of +50
            addKillScore(10);
          }
        } else if (o.type === 'yellow') {
          spawnExplosion(o.x, o.y, 15, 'yellow');
          addBonusScore(50);
        } else if (o.type === 'heart') {
          spawnExplosion(o.x, o.y, 15, 'yellow');
          if (state.lives < state.maxLives) state.lives++;
          updateUI();
        } else if (o.type === 'shield') {
          spawnExplosion(o.x, o.y, 15, 'blue');
          state.shield = 1;
        }
        state.orbs.splice(i, 1);
        updateUI();
      }
    }

    // --- Move orbs ---
    for (var i = state.orbs.length - 1; i >= 0; i--) {
      var o = state.orbs[i];
      o.y += o.vy;
      o.timer++;
      if (o.y > H + 20) state.orbs.splice(i, 1);
    }

    // --- Move particles ---
    for (var i = state.particles.length - 1; i >= 0; i--) {
      var pt = state.particles[i];
      pt.x += pt.vx;
      pt.y += pt.vy;
      pt.vx *= 0.95;
      pt.vy *= 0.95;
      pt.life--;
      if (pt.life <= 0) state.particles.splice(i, 1);
    }

    // --- Move stars ---
    for (var i = 0; i < state.stars.length; i++) {
      state.stars[i].y += state.stars[i].speed;
      if (state.stars[i].y > H) {
        state.stars[i].y = 0;
        state.stars[i].x = Math.random() * W;
      }
    }
  }

  // ===================== UI =====================
  function updateUI() {
    scoreSpan.textContent = '得分: ' + state.score;
    var hearts = '';
    for (var i = 0; i < Math.max(0, state.lives); i++) hearts += '❤';
    livesSpan.textContent = hearts;

    // Shield display
    var shieldSpan = document.getElementById('shieldDisplay');
    if (state.shield > 0) {
      shieldSpan.textContent = '🛡 ';
    } else {
      shieldSpan.textContent = '';
    }

    // Attack level pips
    var pipHtml = '';
    for (var i = 0; i < MAX_ATK; i++) {
      pipHtml += '<span class="atk-pip' + (i < state.attackLevel ? ' filled' : '') + '"></span>';
    }
    atkPips.innerHTML = pipHtml;
  }

  // ===================== Draw =====================
  function draw() {
    // --- Background ---
    var grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#050510');
    grad.addColorStop(0.5, '#0a0a2e');
    grad.addColorStop(1, '#050510');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // --- Stars ---
    for (var i = 0; i < state.stars.length; i++) {
      var s = state.stars[i];
      ctx.globalAlpha = s.bright * (0.6 + 0.4 * Math.sin(state.frame * 0.02 + s.x));
      ctx.fillStyle = '#c8dcff';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // --- Orbs (draw behind everything) ---
    for (var i = 0; i < state.orbs.length; i++) {
      drawOrb(state.orbs[i]);
    }

    // --- Particles (including ring effects) ---
    for (var i = 0; i < state.particles.length; i++) {
      var pt = state.particles[i];
      var alpha = Math.max(0, pt.life / pt.maxLife);
      ctx.globalAlpha = alpha;
      ctx.fillStyle = 'rgb(' + pt.r + ',' + pt.g + ',' + pt.b + ')';
      if (pt.isRing) {
        pt.ringRadius += 2.5;
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, pt.ringRadius, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgb(' + pt.r + ',' + pt.g + ',' + pt.b + ')';
        ctx.lineWidth = 2 + (1 - alpha) * 3;
        ctx.stroke();
      } else {
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, pt.size * (0.5 + alpha * 0.5), 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;

    // --- Player ---
    if (!state.gameOver) {
      if (state.invincible > 0 && Math.floor(state.invincible / 3) % 2 === 0) {
        ctx.globalAlpha = 0.35;
      }
      drawPlayer(state.player);
      ctx.globalAlpha = 1;
    }

    // --- Player bullets ---
    for (var i = 0; i < state.bullets.length; i++) {
      var b = state.bullets[i];
      var gradB = ctx.createLinearGradient(b.x, b.y - b.h/2, b.x, b.y + b.h/2);
      gradB.addColorStop(0, '#ffffff');
      gradB.addColorStop(0.4, '#66ddff');
      gradB.addColorStop(1, '#2266cc');
      ctx.shadowColor = '#66ddff';
      ctx.shadowBlur = 6;
      ctx.fillStyle = gradB;
      ctx.fillRect(b.x - b.w/2, b.y - b.h/2, b.w, b.h);
    }
    ctx.shadowBlur = 0;

    // --- Enemy bullets ---
    ctx.fillStyle = '#ff6644';
    ctx.shadowColor = '#ff4400';
    ctx.shadowBlur = 8;
    for (var i = 0; i < state.enemyBullets.length; i++) {
      var eb = state.enemyBullets[i];
      ctx.beginPath();
      ctx.arc(eb.x, eb.y, 4, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.shadowBlur = 0;

    // --- Enemies ---
    for (var i = 0; i < state.enemies.length; i++) {
      drawEnemy(state.enemies[i]);
    }

    // --- Boss ---
    if (state.boss) drawBoss(state.boss);

    // --- Followers ---
    for (var i = 0; i < state.followers.length; i++) {
      var f = state.followers[i];
      var pulse = 1 + 0.1 * Math.sin(state.frame * 0.08 + i);
      // Follower body: small simplified fighter
      ctx.save();
      ctx.translate(f.x, f.y);
      ctx.shadowColor = '#66ddff';
      ctx.shadowBlur = 8;
      ctx.fillStyle = '#3a8cff';
      var s = 6 + f.level * 1.5;
      ctx.beginPath();
      ctx.moveTo(0, -s * pulse);
      ctx.lineTo(-s*0.8, s*0.5);
      ctx.lineTo(-s*0.3, s*0.8);
      ctx.lineTo(0, s*0.4);
      ctx.lineTo(s*0.3, s*0.8);
      ctx.lineTo(s*0.8, s*0.5);
      ctx.closePath();
      ctx.fill();
      // Level indicator
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold ' + Math.round(6 + f.level * 0.5) + 'px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(f.level, 0, 0);
      ctx.restore();
    }

    // --- Shield visual ---
    if (state.shield > 0 && !state.gameOver) {
      var p = state.player;
      var shieldPulse = 1 + 0.08 * Math.sin(state.frame * 0.06);
      ctx.save();
      ctx.strokeStyle = 'rgba(68, 221, 255, ' + (0.3 + 0.15 * Math.sin(state.frame * 0.05)) + ')';
      ctx.lineWidth = 2;
      ctx.shadowColor = '#44ddff';
      ctx.shadowBlur = 15;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 24 * shieldPulse, 0, Math.PI * 2);
      ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.fillStyle = 'rgba(68, 221, 255, 0.06)';
      ctx.beginPath();
      ctx.arc(p.x, p.y, 24 * shieldPulse, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // --- Skill cooldown bar ---
    if (!state.gameOver) {
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.roundRect(10, 10, 80, 8, 4);
      ctx.fill();
      if (state.skillReady) {
        ctx.fillStyle = '#66ddff';
        ctx.shadowColor = '#66ddff';
        ctx.shadowBlur = 10;
        ctx.roundRect(10, 10, 80, 8, 4);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#ffffff';
        ctx.font = '8px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('E / 双指触屏', 50, 14);
      } else {
        var pct = 1 - state.skillCooldown / 180;
        ctx.fillStyle = '#4488aa';
        ctx.roundRect(10, 10, 80 * pct, 8, 4);
        ctx.fill();
      }
    }

    // --- Level Up Text ---
    if (state.levelUpText > 0) {
      var alpha = Math.min(1, state.levelUpText / 20);
      var scale = 1 + (1 - alpha) * 0.5;
      ctx.save();
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.shadowColor = '#66ddff';
      ctx.shadowBlur = 30;
      ctx.globalAlpha = alpha;
      ctx.fillStyle = '#66ddff';
      ctx.font = 'bold ' + Math.round(36 * scale) + 'px Arial, sans-serif';
      ctx.fillText('⚡ 火力升级!', W/2, H/2 - 80);
      ctx.restore();
    }

    // --- Game Over ---
    if (state.gameOver) {
      ctx.fillStyle = 'rgba(0,0,0,0.7)';
      ctx.fillRect(0, 0, W, H);
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.shadowColor = '#ff0000';
      ctx.shadowBlur = 40;
      ctx.fillStyle = '#ff2222';
      ctx.font = 'bold 64px Arial, sans-serif';
      ctx.fillText('GAME OVER', W/2, H/2 - 50);
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#ffcc00';
      ctx.font = '28px Arial, sans-serif';
      ctx.fillText('最终得分: ' + state.score, W/2, H/2 + 30);
      ctx.fillStyle = '#88ccff';
      ctx.font = '18px Arial, sans-serif';
      ctx.fillText('按 R 键 / 点击按钮 / 触摸屏幕重新开始', W/2, H/2 + 90);
    }
  }

  // ===================== Draw Orb =====================
  function drawOrb(o) {
    var pulse = 1 + 0.15 * Math.sin(o.timer * 0.08);
    var r = o.w/2 * pulse;

    ctx.shadowBlur = 15;
    if (o.type === 'blue') {
      ctx.shadowColor = '#4488ff';
      var grad = ctx.createRadialGradient(o.x, o.y, 0, o.x, o.y, r);
      grad.addColorStop(0, '#aaddff');
      grad.addColorStop(0.4, '#4488ff');
      grad.addColorStop(1, '#224488');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(o.x, o.y, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = 'rgba(255,255,255,0.6)';
      ctx.beginPath();
      ctx.arc(o.x - r*0.2, o.y - r*0.2, r*0.35, 0, Math.PI * 2);
      ctx.fill();
    } else if (o.type === 'yellow') {
      ctx.shadowColor = '#ffcc00';
      var grad = ctx.createRadialGradient(o.x, o.y, 0, o.x, o.y, r);
      grad.addColorStop(0, '#ffffaa');
      grad.addColorStop(0.4, '#ffcc00');
      grad.addColorStop(1, '#886600');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(o.x, o.y, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.beginPath();
      ctx.arc(o.x - r*0.2, o.y - r*0.2, r*0.35, 0, Math.PI * 2);
      ctx.fill();
    } else if (o.type === 'heart') {
      // Draw a heart
      ctx.shadowColor = '#ff2266';
      ctx.shadowBlur = 20;
      ctx.fillStyle = '#ff2266';
      var s = r * 0.6;
      ctx.beginPath();
      ctx.moveTo(o.x, o.y + s);
      ctx.bezierCurveTo(o.x - s*1.5, o.y - s*0.5, o.x - s*0.5, o.y - s*1.5, o.x, o.y - s*0.5);
      ctx.bezierCurveTo(o.x + s*0.5, o.y - s*1.5, o.x + s*1.5, o.y - s*0.5, o.x, o.y + s);
      ctx.fill();
      ctx.shadowBlur = 0;
    } else if (o.type === 'shield') {
      // Draw a shield hexagon
      ctx.shadowColor = '#44ddff';
      ctx.shadowBlur = 20;
      ctx.strokeStyle = '#44ddff';
      ctx.lineWidth = 3;
      ctx.beginPath();
      for (var i = 0; i < 6; i++) {
        var angle = i * Math.PI/3 - Math.PI/6;
        var px = o.x + r * Math.cos(angle);
        var py = o.y + r * Math.sin(angle);
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.stroke();
      // Inner fill
      ctx.fillStyle = 'rgba(68, 221, 255, 0.2)';
      ctx.fill();
      ctx.shadowBlur = 0;
    }
    ctx.shadowBlur = 0;
  }

  // ===================== Draw Player =====================
  function drawPlayer(p) {
    var cx = p.x, cy = p.y, hw = p.w/2, hh = p.h/2;

    // Engine flame (varies with attack level)
    var flameH = 8 + state.attackLevel * 3;
    ctx.shadowColor = '#3399ff';
    ctx.shadowBlur = 20;
    var flameGrad = ctx.createLinearGradient(cx, cy + hh, cx, cy + hh + flameH);
    flameGrad.addColorStop(0, '#66ddff');
    flameGrad.addColorStop(0.5, '#3399ff');
    flameGrad.addColorStop(1, 'rgba(0,50,150,0)');
    ctx.fillStyle = flameGrad;
    ctx.beginPath();
    ctx.moveTo(cx - 8, cy + hh - 4);
    ctx.quadraticCurveTo(cx - 12, cy + hh + flameH * 0.6, cx, cy + hh + flameH);
    ctx.quadraticCurveTo(cx + 12, cy + hh + flameH * 0.6, cx + 8, cy + hh - 4);
    ctx.fill();
    ctx.shadowBlur = 0;

    // Body
    ctx.shadowColor = '#3399ff';
    ctx.shadowBlur = 10;
    ctx.fillStyle = '#1a5cad';
    ctx.beginPath();
    ctx.moveTo(cx, cy - hh);
    ctx.lineTo(cx - hw, cy - 2);
    ctx.lineTo(cx - hw - 4, cy + 6);
    ctx.lineTo(cx - hw/2 + 2, cy + 8);
    ctx.lineTo(cx - hw/2 + 2, cy + hh - 4);
    ctx.lineTo(cx - 4, cy + hh - 6);
    ctx.lineTo(cx + 4, cy + hh - 6);
    ctx.lineTo(cx + hw/2 - 2, cy + hh - 4);
    ctx.lineTo(cx + hw/2 - 2, cy + 8);
    ctx.lineTo(cx + hw + 4, cy + 6);
    ctx.lineTo(cx + hw, cy - 2);
    ctx.closePath();
    ctx.fill();

    // Fuselage
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#3a8cff';
    ctx.beginPath();
    ctx.moveTo(cx, cy - hh + 4);
    ctx.lineTo(cx - 4, cy + 4);
    ctx.lineTo(cx + 4, cy + 4);
    ctx.closePath();
    ctx.fill();

    // Cockpit
    ctx.fillStyle = '#5ab0ff';
    ctx.beginPath();
    ctx.arc(cx, cy - hh/3, 6, 0, Math.PI * 2);
    ctx.fill();

    // Wing marks
    ctx.fillStyle = '#ff8800';
    ctx.beginPath();
    ctx.arc(cx - hw/2, cy + 4, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(cx + hw/2, cy + 4, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  // ===================== Draw Enemy =====================
  function drawEnemy(e) {
    var cx = e.x, cy = e.y, hw = e.w/2, hh = e.h/2;

    if (e.type === 'elite') {
      ctx.shadowColor = e.flash ? '#ffffff' : '#aa44ff';
      ctx.shadowBlur = e.flash ? 20 : 10;
      var gradE = ctx.createRadialGradient(cx, cy, 0, cx, cy, hw);
      gradE.addColorStop(0, e.flash ? '#ffffff' : '#bb55ff');
      gradE.addColorStop(0.6, e.flash ? '#ff88ff' : '#8822cc');
      gradE.addColorStop(1, e.flash ? '#ff66ff' : '#551188');
      ctx.fillStyle = gradE;
      ctx.beginPath();
      ctx.moveTo(cx, cy - hh);
      ctx.lineTo(cx + hw, cy - hh/3);
      ctx.lineTo(cx + hw*0.7, cy + hh);
      ctx.lineTo(cx - hw*0.7, cy + hh);
      ctx.lineTo(cx - hw, cy - hh/3);
      ctx.closePath();
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = e.flash ? '#ffccff' : '#cc77ff';
      ctx.beginPath();
      ctx.moveTo(cx, cy - hh/2);
      ctx.lineTo(cx + hw/2, cy - hh/6);
      ctx.lineTo(cx + hw/3, cy + hh/2);
      ctx.lineTo(cx - hw/3, cy + hh/2);
      ctx.lineTo(cx - hw/2, cy - hh/6);
      ctx.closePath();
      ctx.fill();
      // HP bar
      var hpPct = e.hp / e.maxHp;
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(cx - hw, cy - hh - 8, hw*2, 4);
      ctx.fillStyle = hpPct > 0.5 ? '#66ff66' : hpPct > 0.25 ? '#ffcc00' : '#ff4444';
      ctx.fillRect(cx - hw, cy - hh - 8, hw*2 * hpPct, 4);
      ctx.shadowBlur = 0;
      return;
    }

    // Flash white on hit
    ctx.shadowBlur = e.flash ? 20 : 8;

    if (e.color === 'orange' || e.type === 'fast') {
      // Fast: small dart shape
      ctx.shadowColor = '#ff8800';
      ctx.fillStyle = e.flash ? '#ffffff' : '#dd6622';
      ctx.beginPath();
      ctx.moveTo(cx, cy - hh);
      ctx.lineTo(cx - hw*0.6, cy + hh*0.6);
      ctx.lineTo(cx - hw*0.2, cy + hh*0.3);
      ctx.lineTo(cx, cy + hh);
      ctx.lineTo(cx + hw*0.2, cy + hh*0.3);
      ctx.lineTo(cx + hw*0.6, cy + hh*0.6);
      ctx.closePath();
      ctx.fill();
    } else if (e.color === 'darkred' || e.type === 'tank') {
      // Tank: hexagon with HP indicator
      ctx.shadowColor = '#cc2222';
      ctx.fillStyle = e.flash ? '#ffffff' : '#882222';
      ctx.beginPath();
      for (var i = 0; i < 6; i++) {
        var angle = i * Math.PI/3;
        var px = cx + hw * 0.85 * Math.cos(angle);
        var py = cy + hh * 0.85 * Math.sin(angle);
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#cc4444';
      ctx.beginPath();
      ctx.arc(cx, cy, hw * 0.35, 0, Math.PI * 2);
      ctx.fill();
      // HP dots
      var hpDot = Math.max(0, e.hp);
      for (var i = 0; i < e.maxHp; i++) {
        ctx.fillStyle = i < hpDot ? '#66ff66' : '#333333';
        ctx.beginPath();
        ctx.arc(cx - 6 + i * 6, cy + hh + 4, 2, 0, Math.PI * 2);
        ctx.fill();
      }
    } else if (e.color === 'magenta' || e.type === 'shooter') {
      // Shooter: diamond with eye
      ctx.shadowColor = '#ff44aa';
      ctx.fillStyle = e.flash ? '#ffffff' : '#bb2288';
      ctx.beginPath();
      ctx.moveTo(cx, cy - hh);
      ctx.lineTo(cx + hw, cy);
      ctx.lineTo(cx, cy + hh);
      ctx.lineTo(cx - hw, cy);
      ctx.closePath();
      ctx.fill();
      // Eye
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#ff66cc';
      ctx.beginPath();
      ctx.arc(cx, cy, 3, 0, Math.PI * 2);
      ctx.fill();
    } else if (e.color === 'cyan' || e.type === 'waver') {
      // Waver: sleek crescent
      ctx.shadowColor = '#22ddff';
      ctx.fillStyle = e.flash ? '#ffffff' : '#228899';
      ctx.beginPath();
      ctx.moveTo(cx - hw, cy - hh*0.6);
      ctx.quadraticCurveTo(cx, cy - hh*1.1, cx + hw, cy - hh*0.6);
      ctx.quadraticCurveTo(cx + hw*0.5, cy, cx + hw, cy + hh*0.6);
      ctx.quadraticCurveTo(cx, cy + hh*1.1, cx - hw, cy + hh*0.6);
      ctx.quadraticCurveTo(cx - hw*0.5, cy, cx - hw, cy - hh*0.6);
      ctx.closePath();
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#44ddff';
      ctx.beginPath();
      ctx.arc(cx, cy, 4, 0, Math.PI * 2);
      ctx.fill();
    } else if (e.color === 'green' || e.type === 'splitter') {
      // Splitter: double triangle
      ctx.shadowColor = '#44ff44';
      ctx.fillStyle = e.flash ? '#ffffff' : '#22aa22';
      // Top triangle
      ctx.beginPath();
      ctx.moveTo(cx, cy - hh);
      ctx.lineTo(cx - hw*0.7, cy);
      ctx.lineTo(cx + hw*0.7, cy);
      ctx.closePath();
      ctx.fill();
      // Bottom triangle
      ctx.beginPath();
      ctx.moveTo(cx - hw*0.7, cy);
      ctx.lineTo(cx + hw*0.7, cy);
      ctx.lineTo(cx, cy + hh);
      ctx.closePath();
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#44ff66';
      ctx.beginPath();
      ctx.arc(cx, cy, 2, 0, Math.PI * 2);
      ctx.fill();
    } else {
      // Basic: triangle
      ctx.shadowColor = '#ff3333';
      ctx.fillStyle = e.flash ? '#ffffff' : '#cc2222';
      ctx.beginPath();
      ctx.moveTo(cx, cy - hh);
      ctx.lineTo(cx - hw, cy + hh);
      ctx.lineTo(cx + hw, cy + hh);
      ctx.closePath();
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#ff4444';
      ctx.beginPath();
      ctx.moveTo(cx, cy - hh/2);
      ctx.lineTo(cx - hw/2, cy + hh/2);
      ctx.lineTo(cx + hw/2, cy + hh/2);
      ctx.closePath();
      ctx.fill();
    }
    ctx.shadowBlur = 0;
  }

  // ===================== Draw Boss =====================
  function drawBoss(boss) {
    var cx = boss.x, cy = boss.y, hw = boss.w/2, hh = boss.h/2;

    // Glow
    ctx.shadowColor = boss.flash ? '#ffffff' : '#ff3333';
    ctx.shadowBlur = boss.flash ? 35 : 15;

    // Main body
    var gradB = ctx.createRadialGradient(cx - 10, cy - 10, 0, cx, cy, hw);
    gradB.addColorStop(0, boss.flash ? '#ffffff' : '#cc4444');
    gradB.addColorStop(0.4, boss.flash ? '#ff8888' : '#882222');
    gradB.addColorStop(1, boss.flash ? '#ff4444' : '#440000');
    ctx.fillStyle = gradB;

    // Hexagonal shape
    ctx.beginPath();
    for (var i = 0; i < 6; i++) {
      var angle = Math.PI/6 + i * Math.PI/3;
      var px = cx + hw * 0.9 * Math.cos(angle);
      var py = cy + hh * 0.9 * Math.sin(angle);
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fill();

    // Inner ring
    ctx.shadowBlur = 0;
    ctx.strokeStyle = '#ff6666';
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (var i = 0; i < 6; i++) {
      var angle = i * Math.PI/3;
      var px = cx + hw * 0.5 * Math.cos(angle);
      var py = cy + hh * 0.5 * Math.sin(angle);
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.stroke();

    // Core
    ctx.fillStyle = boss.flash ? '#ffff88' : '#ffcc00';
    ctx.shadowColor = '#ffcc00';
    ctx.shadowBlur = 20;
    ctx.beginPath();
    ctx.arc(cx, cy, 12 + 3 * Math.sin(state.frame * 0.06), 0, Math.PI * 2);
    ctx.fill();

    // Eye
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#ff0000';
    ctx.beginPath();
    ctx.arc(cx, cy, 5, 0, Math.PI * 2);
    ctx.fill();

    ctx.shadowBlur = 0;

    // HP bar (top of screen)
    var barW = 300;
    var barH = 12;
    var barX = (W - barW) / 2;
    var barY = 10;
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.roundRect(barX, barY, barW, barH, 6);
    ctx.fill();
    var hpPct = boss.hp / boss.maxHp;
    ctx.fillStyle = hpPct > 0.5 ? '#66ff66' : hpPct > 0.25 ? '#ffcc00' : '#ff4444';
    ctx.shadowColor = hpPct > 0.5 ? '#66ff66' : hpPct > 0.25 ? '#ffcc00' : '#ff4444';
    ctx.shadowBlur = 8;
    ctx.roundRect(barX + 2, barY + 2, (barW - 4) * hpPct, barH - 4, 4);
    ctx.fill();
    ctx.shadowBlur = 0;

    // Boss label
    ctx.fillStyle = '#ff6666';
    ctx.font = 'bold 11px Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'bottom';
    ctx.fillText('BOSS', cx, cy - hh - 12);
  }

  // ===================== roundRect polyfill =====================
  if (!CanvasRenderingContext2D.prototype.roundRect) {
    CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
      if (typeof r === 'number') r = [r];
      var radii = r.map(function(v) { return Math.min(v, Math.min(w, h) / 2); });
      var tl = radii[0] || 0;
      this.moveTo(x + tl, y);
      this.lineTo(x + w - tl, y);
      this.quadraticCurveTo(x + w, y, x + w, y + tl);
      this.lineTo(x + w, y + h - tl);
      this.quadraticCurveTo(x + w, y + h, x + w - tl, y + h);
      this.lineTo(x + tl, y + h);
      this.quadraticCurveTo(x, y + h, x, y + h - tl);
      this.lineTo(x, y + tl);
      this.quadraticCurveTo(x, y, x + tl, y);
      this.closePath();
    };
  }

  // ===================== Game Loop =====================
  function gameLoop() {
    try {
      update();
      draw();
    } catch (err) {
      console.error('Game error:', err);
    }
    requestAnimationFrame(gameLoop);
  }

  // ===================== Init =====================
  initStars();
  state.player = makePlayer();
  updateUI();
  gameLoop();

})();
</script>
