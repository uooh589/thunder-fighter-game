<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>雷霆战机 - Thunder Fighter</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a1a;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Segoe UI', 'Arial', sans-serif;
    user-select: none;
  }
  .game-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  canvas {
    border: 2px solid #3399ff;
    border-radius: 8px;
    box-shadow: 0 0 40px rgba(51,153,255,0.3);
    display: block;
    cursor: none;
  }
  .info-bar {
    width: 100%;
    display: flex;
    justify-content: space-between;
    color: #88ccff;
    font-size: 14px;
    padding: 0 4px;
  }
  .controls {
    color: #6699aa;
    font-size: 13px;
    letter-spacing: 0.5px;
  }
  .controls kbd {
    background: #1a2a3a;
    color: #66ddff;
    padding: 2px 8px;
    border-radius: 4px;
    border: 1px solid #335566;
    font-size: 12px;
  }
  .restart-btn {
    background: #1a2a3a;
    color: #66ddff;
    border: 1px solid #3399ff;
    padding: 6px 20px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    transition: all 0.2s;
  }
  .restart-btn:hover {
    background: #1a3a5a;
    box-shadow: 0 0 15px rgba(51,153,255,0.4);
  }
</style>
</head>
<body>
<div class="game-wrapper">
  <div class="info-bar">
    <span id="scoreDisplay">得分: 0</span>
    <span id="livesDisplay">❤❤❤</span>
  </div>
  <canvas id="gameCanvas" width="800" height="600"></canvas>
  <div class="controls">
    <kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd> 或 <kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> 移动 &nbsp;|&nbsp; <kbd>R</kbd> 重新开始 &nbsp;|&nbsp; <button class="restart-btn" id="restartBtn">✈ 重新开始</button>
  </div>
</div>
<script>
(function() {
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const scoreSpan = document.getElementById('scoreDisplay');
  const livesSpan = document.getElementById('livesDisplay');

  const W = 800, H = 600;

  // ---------- Game State ----------
  let game = {
    player: null,
    bullets: [],
    enemies: [],
    explosions: [],
    stars: [],
    score: 0,
    lives: 3,
    invincible: 0,
    gameOver: false,
    frame: 0,
    shootCooldown: 0,
    running: true,
  };

  // ---------- Stars ----------
  function initStars() {
    game.stars = [];
    for (let i = 0; i < 120; i++) {
      game.stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        speed: 0.3 + Math.random() * 0.8,
        size: 0.5 + Math.random() * 1.5,
        brightness: 0.3 + Math.random() * 0.7,
      });
    }
  }

  // ---------- Player ----------
  function createPlayer() {
    return {
      x: W / 2,
      y: H - 60,
      w: 30,
      h: 36,
      speed: 5,
      keys: { up: false, down: false, left: false, right: false },
    };
  }

  // ---------- Entities ----------
  function spawnEnemy() {
    if (game.enemies.length >= 20) return;
    const size = 18 + Math.random() * 14;
    const type = Math.random() > 0.5 ? 'triangle' : 'diamond';
    game.enemies.push({
      x: Math.random() * (W - size * 2) + size,
      y: -size,
      w: size,
      h: size,
      speed: 1.2 + Math.random() * 1.8,
      type: type,
    });
  }

  function spawnBullet() {
    if (game.bullets.length >= 30) return;
    const p = game.player;
    game.bullets.push({
      x: p.x,
      y: p.y - p.h / 2 - 4,
      w: 4,
      h: 14,
      speed: 8,
    });
  }

  function spawnExplosion(x, y, size) {
    const count = 8 + Math.floor(size / 4);
    const particles = [];
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 1 + Math.random() * 3;
      particles.push({
        x: 0, y: 0,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: 20 + Math.random() * 20,
        maxLife: 20 + Math.random() * 20,
        size: 2 + Math.random() * 4,
        color: Math.random() > 0.5 ? '#ff6600' : '#ffcc00',
      });
    }
    game.explosions.push({ x, y, particles, alive: true });
  }

  // ---------- Reset Game ----------
  function resetGame() {
    // Clear stuck keys
    for (const k in keys) keys[k] = false;
    game.player = createPlayer();
    game.bullets = [];
    game.enemies = [];
    game.explosions = [];
    game.score = 0;
    game.lives = 3;
    game.invincible = 0;
    game.gameOver = false;
    game.frame = 0;
    game.shootCooldown = 0;
    game.running = true;
    initStars();
    updateUI();
  }

  // ---------- Input ----------
  const keys = {};
  window.addEventListener('keydown', (e) => {
    keys[e.key] = true;
    if (e.key === 'r' || e.key === 'R') {
      resetGame();
    }
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) {
      e.preventDefault();
    }
  });
  window.addEventListener('keyup', (e) => {
    keys[e.key] = false;
  });

  document.getElementById('restartBtn').addEventListener('click', resetGame);

  // ---------- Update ----------
  function update() {
    if (game.gameOver) return;

    game.frame++;

    // Player movement
    const p = game.player;
    const moveSpeed = p.speed;
    if (keys['ArrowLeft'] || keys['a'] || keys['A']) p.x -= moveSpeed;
    if (keys['ArrowRight'] || keys['d'] || keys['D']) p.x += moveSpeed;
    if (keys['ArrowUp'] || keys['w'] || keys['W']) p.y -= moveSpeed;
    if (keys['ArrowDown'] || keys['s'] || keys['S']) p.y += moveSpeed;
    // Clamp
    p.x = Math.max(p.w / 2, Math.min(W - p.w / 2, p.x));
    p.y = Math.max(p.h / 2, Math.min(H - p.h / 2, p.y));

    // Invincibility countdown
    if (game.invincible > 0) game.invincible--;

    // Auto-shoot
    if (game.shootCooldown <= 0) {
      spawnBullet();
      game.shootCooldown = 8;
    } else {
      game.shootCooldown--;
    }

    // Spawn enemies
    if (game.frame % 30 === 0) {
      spawnEnemy();
    }

    // Update bullets
    for (let i = game.bullets.length - 1; i >= 0; i--) {
      const b = game.bullets[i];
      b.y -= b.speed;
      if (b.y + b.h < 0) {
        game.bullets.splice(i, 1);
        continue;
      }
    }

    // Update enemies
    for (let i = game.enemies.length - 1; i >= 0; i--) {
      const e = game.enemies[i];
      e.y += e.speed;
      if (e.y - e.h > H) {
        game.enemies.splice(i, 1);
      }
    }

    // Bullet-Enemy collision
    for (let i = game.bullets.length - 1; i >= 0; i--) {
      const b = game.bullets[i];
      let hit = false;
      for (let j = game.enemies.length - 1; j >= 0; j--) {
        const e = game.enemies[j];
        if (rectCollide(b.x - b.w/2, b.y - b.h/2, b.w, b.h,
                        e.x - e.w/2, e.y - e.h/2, e.w, e.h)) {
          spawnExplosion(e.x, e.y, e.w);
          game.enemies.splice(j, 1);
          game.score += 10;
          updateUI();
          hit = true;
          break;
        }
      }
      if (hit) {
        game.bullets.splice(i, 1);
      }
    }

    // Player-Enemy collision (at most 1 hit per frame)
    if (game.invincible <= 0 && !game.gameOver) {
      for (let i = game.enemies.length - 1; i >= 0; i--) {
        const e = game.enemies[i];
        if (rectCollide(p.x - p.w/2, p.y - p.h/2, p.w, p.h,
                        e.x - e.w/2, e.y - e.h/2, e.w, e.h)) {
          spawnExplosion(e.x, e.y, e.w);
          game.enemies.splice(i, 1);
          game.lives--;
          game.invincible = 60; // 1 second at 60fps
          updateUI();
          if (game.lives <= 0) {
            game.gameOver = true;
          }
          break; // only one hit per frame
        }
      }
    }

    // Update explosions
    for (let i = game.explosions.length - 1; i >= 0; i--) {
      const ex = game.explosions[i];
      let alive = false;
      for (const pt of ex.particles) {
        pt.x += pt.vx;
        pt.y += pt.vy;
        pt.vx *= 0.96;
        pt.vy *= 0.96;
        pt.life--;
        if (pt.life > 0) alive = true;
      }
      if (!alive) {
        game.explosions.splice(i, 1);
      }
    }

    // Update stars
    for (const s of game.stars) {
      s.y += s.speed;
      if (s.y > H) {
        s.y = 0;
        s.x = Math.random() * W;
      }
    }
  }

  function rectCollide(x1, y1, w1, h1, x2, y2, w2, h2) {
    return x1 < x2 + w2 && x1 + w1 > x2 &&
           y1 < y2 + h2 && y1 + h1 > y2;
  }

  // ---------- UI ----------
  function updateUI() {
    scoreSpan.textContent = '得分: ' + game.score;
    livesSpan.textContent = '❤'.repeat(Math.max(0, game.lives));
  }

  // ---------- Draw ----------
  function draw() {
    ctx.clearRect(0, 0, W, H);

    // ---- Background ----
    // Dark gradient
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#050510');
    grad.addColorStop(0.5, '#0a0a2e');
    grad.addColorStop(1, '#050510');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // Stars
    for (const s of game.stars) {
      const alpha = s.brightness * (0.6 + 0.4 * Math.sin(game.frame * 0.02 + s.x));
      ctx.fillStyle = `rgba(200, 220, 255, ${alpha})`;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
      ctx.fill();
    }

    // ---- Explosions ----
    for (const ex of game.explosions) {
      for (const pt of ex.particles) {
        const alpha = pt.life / pt.maxLife;
        ctx.globalAlpha = alpha;
        ctx.fillStyle = pt.color;
        ctx.beginPath();
        ctx.arc(ex.x + pt.x, ex.y + pt.y, pt.size * alpha, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    // ---- Player ----
    if (!game.gameOver) {
      const p = game.player;
      // Invincibility flash
      if (game.invincible > 0 && Math.floor(game.invincible / 4) % 2 === 0) {
        ctx.globalAlpha = 0.4;
      }
      drawPlayer(p);
      ctx.globalAlpha = 1;
    }

    // ---- Bullets ----
    for (const b of game.bullets) {
      ctx.fillStyle = '#66ddff';
      ctx.shadowColor = '#66ddff';
      ctx.shadowBlur = 8;
      const gradB = ctx.createLinearGradient(b.x, b.y - b.h/2, b.x, b.y + b.h/2);
      gradB.addColorStop(0, '#ffffff');
      gradB.addColorStop(0.3, '#66ddff');
      gradB.addColorStop(1, '#3399ff');
      ctx.fillStyle = gradB;
      ctx.shadowBlur = 10;
      ctx.fillRect(b.x - b.w/2, b.y - b.h/2, b.w, b.h);
      ctx.shadowBlur = 0;
    }

    // ---- Enemies ----
    for (const e of game.enemies) {
      drawEnemy(e);
    }

    // ---- Game Over overlay ----
    if (game.gameOver) {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.65)';
      ctx.fillRect(0, 0, W, H);

      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      ctx.shadowColor = '#ff3333';
      ctx.shadowBlur = 30;
      ctx.fillStyle = '#ff2222';
      ctx.font = 'bold 64px "Segoe UI", Arial, sans-serif';
      ctx.fillText('GAME OVER', W / 2, H / 2 - 40);

      ctx.shadowBlur = 0;
      ctx.fillStyle = '#ffcc00';
      ctx.font = '28px "Segoe UI", Arial, sans-serif';
      ctx.fillText('最终得分: ' + game.score, W / 2, H / 2 + 40);

      ctx.fillStyle = '#88ccff';
      ctx.font = '18px "Segoe UI", Arial, sans-serif';
      ctx.fillText('按 R 键或点击按钮重新开始', W / 2, H / 2 + 100);
    }

    // ---- Score on canvas ----
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.fillStyle = '#88ccff';
    ctx.font = '16px "Segoe UI", Arial, sans-serif';
  }

  function drawPlayer(p) {
    const cx = p.x, cy = p.y;
    // Engine glow
    ctx.save();
    ctx.shadowColor = '#3399ff';
    ctx.shadowBlur = 20;
    ctx.fillStyle = '#3399ff';
    ctx.beginPath();
    ctx.ellipse(cx, cy + p.h/2 - 4, 8, 12, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.restore();

    // Main body
    ctx.save();
    ctx.translate(cx, cy);

    // Body - sleek fighter shape
    ctx.shadowColor = '#3399ff';
    ctx.shadowBlur = 15;
    ctx.fillStyle = '#2266cc';
    ctx.beginPath();
    ctx.moveTo(0, -p.h/2);           // nose
    ctx.lineTo(-p.w/2 + 2, 0);       // left wing
    ctx.lineTo(-p.w/2 - 4, p.h/4);   // left tip
    ctx.lineTo(-p.w/4, p.h/4);       // left body
    ctx.lineTo(-p.w/4, p.h/2 - 2);   // left tail
    ctx.lineTo(-4, p.h/2 - 4);       // center left
    ctx.lineTo(4, p.h/2 - 4);        // center right
    ctx.lineTo(p.w/4, p.h/2 - 2);    // right tail
    ctx.lineTo(p.w/4, p.h/4);        // right body
    ctx.lineTo(p.w/2 + 4, p.h/4);    // right tip
    ctx.lineTo(p.w/2 - 2, 0);        // right wing
    ctx.closePath();
    ctx.fill();

    // Cockpit highlight
    ctx.shadowBlur = 5;
    ctx.fillStyle = '#44aaff';
    ctx.beginPath();
    ctx.ellipse(0, -p.h/6, 7, 10, 0, 0, Math.PI * 2);
    ctx.fill();

    // Wing accents
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#ff6600';
    ctx.beginPath();
    ctx.ellipse(-p.w/3, p.h/8, 5, 2, -0.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(p.w/3, p.h/8, 5, 2, 0.3, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  function drawEnemy(e) {
    ctx.save();
    ctx.translate(e.x, e.y);

    ctx.shadowColor = '#ff3333';
    ctx.shadowBlur = 10;

    if (e.type === 'triangle') {
      // Sharp triangle enemy
      ctx.fillStyle = '#cc2222';
      ctx.beginPath();
      ctx.moveTo(0, -e.h/2);
      ctx.lineTo(-e.w/2, e.h/2);
      ctx.lineTo(e.w/2, e.h/2);
      ctx.closePath();
      ctx.fill();

      ctx.shadowBlur = 0;
      ctx.fillStyle = '#ff4444';
      ctx.beginPath();
      ctx.moveTo(0, -e.h/3);
      ctx.lineTo(-e.w/4, e.h/4);
      ctx.lineTo(e.w/4, e.h/4);
      ctx.closePath();
      ctx.fill();
    } else {
      // Diamond/enhanced enemy
      ctx.fillStyle = '#dd3333';
      ctx.beginPath();
      ctx.moveTo(0, -e.h/2);
      ctx.lineTo(e.w/2, 0);
      ctx.lineTo(0, e.h/2);
      ctx.lineTo(-e.w/2, 0);
      ctx.closePath();
      ctx.fill();

      ctx.shadowBlur = 0;
      ctx.fillStyle = '#ff5555';
      ctx.beginPath();
      ctx.moveTo(0, -e.h/3);
      ctx.lineTo(e.w/3, 0);
      ctx.lineTo(0, e.h/3);
      ctx.lineTo(-e.w/3, 0);
      ctx.closePath();
      ctx.fill();

      // Center dot
      ctx.fillStyle = '#ffcc00';
      ctx.beginPath();
      ctx.arc(0, 0, 3, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.restore();
  }

  // ---------- Game Loop ----------
  function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
  }

  // ---------- Init ----------
  resetGame();
  gameLoop();

  // Export reset for debug
  window.resetGame = resetGame;
})();
</script>
</body>
</html>
