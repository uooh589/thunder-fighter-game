<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a2e"/>
      <stop offset="100%" stop-color="#050510"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="64" fill="url(#bg)"/>
  <!-- Fighter ship -->
  <polygon points="256,80 200,240 200,432 256,380 312,432 312,240" fill="#3399ff" stroke="#66ddff" stroke-width="6"/>
  <polygon points="256,160 220,260 292,260" fill="#66ddff"/>
  <!-- Wings -->
  <polygon points="200,240 140,280 180,300" fill="#2266cc" stroke="#44aaff" stroke-width="4"/>
  <polygon points="312,240 372,280 332,300" fill="#2266cc" stroke="#44aaff" stroke-width="4"/>
  <!-- Engine glow -->
  <ellipse cx="256" cy="400" rx="20" ry="30" fill="#3399ff" opacity="0.6"/>
  <!-- Star -->
  <circle cx="100" cy="100" r="6" fill="#ffffff" opacity="0.8"/>
  <circle cx="400" cy="80" r="4" fill="#ffffff" opacity="0.6"/>
  <circle cx="80" cy="350" r="3" fill="#ffffff" opacity="0.5"/>
  <circle cx="440" cy="300" r="5" fill="#ffffff" opacity="0.7"/>
  <circle cx="200" cy="70" r="3" fill="#ffffff" opacity="0.4"/>
</svg>
